.run{animation:run 7s linear infinite}
@keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.scan{animation:scan 7s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
