@keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.fadein{animation:fadein .7s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 1.30s linear infinite}@keyframes wave{to{transform:translateX(-40px)}}
